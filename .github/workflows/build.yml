name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']          # тег v1.0.1 = выпуск новой версии
  workflow_dispatch:       # ручной запуск кнопкой на вкладке Actions

permissions:
  contents: write          # нужно, чтобы прикрепить APK к релизу

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK уже установлен на runner, нужно только принять лицензии
      - name: Принимаем лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Определяем версию
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ключ подписи (если добавлен в Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Используется ваш ключ подписи"
          else
            echo "Секретов нет — используется встроенный ключ app/maysk-debug.keystore"
          fi

      - name: Сборка release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          gradle :app:assembleRelease --no-daemon
          -PappVersionName=${{ steps.ver.outputs.name }}
          -PappVersionCode=${{ github.run_number }}

      - name: Переименовываем APK
        run: cp app/build/outputs/apk/release/app-release.apk "MayskGallery-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MayskGallery-${{ steps.ver.outputs.name }}
          path: MayskGallery-*.apk

      # Каждый push в main = новый релиз v1.0.<номер сборки>. Его и видит приложение при проверке обновлений.
      - name: Публикуем релиз
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.name) }}
          target_commitish: ${{ github.sha }}
          files: MayskGallery-*.apk
          generate_release_notes: true
          make_latest: true
